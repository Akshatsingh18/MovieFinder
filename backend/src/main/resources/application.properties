server.port=${PORT:8080}
spring.config.import=optional:file:./.env[.properties]
app.region=${APP_REGION:IN}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.cache-dir=${APP_CACHE_DIR:data/cache}
app.cache-ttl-seconds=${APP_CACHE_TTL_SECONDS:21600}
app.sync-pages=${APP_SYNC_PAGES:5}
app.sync-interval-ms=${APP_SYNC_INTERVAL_MS:86400000}
app.sync-open-cooldown-ms=${APP_SYNC_OPEN_COOLDOWN_MS:21600000}
app.rating-recheck-days=${APP_RATING_RECHECK_DAYS:7}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/movie_finder}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=6
